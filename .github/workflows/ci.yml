# Ruff and the suite were already clean locally; without this they were clean
# only for whoever remembered to run them.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the image's Python, and the one the owner develops on
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The suite must run against the dependency tree production gets, or
      # green here says nothing about the image. The lock installs first with
      # its hashes; the dev extras go on top without disturbing it.
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install pytest==9.1.1 httpx2==0.29.0 ruff==0.14.6
      - run: pip check
      - run: ruff check app tests
      - run: python -m compileall -q app
      - run: pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # proves the hashed lock still installs, which the suite cannot
      - run: docker build -t holiday-radar:ci .
