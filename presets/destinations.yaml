# Destination pool. Coordinates feed the Open-Meteo climate-normal lookups
# (±0.2° is irrelevant at monthly resolution). Tier = typical nonstop time
# from the Baltics: short <= 4.5 h, medium 4.5-7 h, long > 7 h / 1-stop.
# The watchlist is DERIVED from this pool by climate rules — nothing here is
# watched unconditionally. Notes flag family-relevant caveats honestly.
#
# The pool is DESTINATION-driven, not carrier-driven (owner, 2026-08-23):
# we fly with whoever is cheapest, and the Google sampler prices every
# airline including one-stop connections. Reviewed 2026-08-23 against the
# real airBaltic and Ryanair network maps plus the published TLL/HEL/RIX
# 2026 schedules; gaps found there were added below.

