# holiday-radar configuration. Country-agnostic: swap the presets to adapt.
# Secrets (Travelpayouts token) live in .env, never here.

currency: EUR

passengers: {adults: 2, children: 2, infants: 0}

# Origin airports with honest logistics handicaps:
#   effective = fare + handicap_fixed_eur + handicap_per_day_eur x trip days
# (trip days = nights + 1). extra_time_h is DISPLAYED, never auto-priced.
# hotel_eur is CONDITIONAL: one night added only when the flight departs too
# early / returns too late for the ferry or the drive — stage A has no flight
# times, so it is applied at stage-B verify and shown as a risk note until
# then.
#
# RIX math (owner, 2026-08-23): drive Tallinn-Riga ~310 km x 2 = 620 km at
# 10 l/100 km, diesel ~1.70 EUR/l -> ~105 EUR fuel; official RIX long-term
# parking (P2/P3/P4) = 7 EUR first day + 5 EUR/day after -> fixed 107 + 5/day.
# Own car flexes for early/late flights — the ~110 EUR hotel is a NARROW edge
# case: only a ~06:00 departure ("kahtlane") or an ~03:00-night arrival.
#
# HEL math (owner, 2026-08-23, prices checked): foot-passenger ferry
# Tallinn-Helsinki, family 2+2 round trip ~150 EUR as a planning mid-range
# (adults ~25 EUR/leg booked ahead, children ~half; cheap midweek can be 60,
# weekend peak 250+); Bolt West Harbour <-> HEL airport ~35 EUR x 2 = 70 EUR
# (no car on this route, luggage rules out transit) -> fixed 220. The ferry
# schedule is the binding constraint: flights before ~12:00 or landings after
# ~21:00 need a ~90 EUR hotel night.
origins:
  - {code: TLL, handicap_fixed_eur: 0,   handicap_per_day_eur: 0, hotel_eur: 0,
     extra_time_h: 0, note: "home airport"}
  - {code: HEL, handicap_fixed_eur: 220, handicap_per_day_eur: 0, hotel_eur: 90,
     hotel_if_departure_before: "12:00", hotel_if_arrival_after: "21:00",
     extra_time_h: 4, note: "ferry (family ~150) + Bolt x2 (~70)"}
  - {code: RIX, handicap_fixed_eur: 107, handicap_per_day_eur: 5, hotel_eur: 110,
     hotel_if_departure_before: "07:00", hotel_if_arrival_after: "02:30",
     extra_time_h: 5, note: "620 km drive + RIX long-term parking"}

holidays:
  preset: presets/holidays_ee.yaml
  active: [autumn-2026, christmas-2026, spring-2027, autumn-2027]

destinations:
  preset: presets/destinations.yaml

# Climate rules classify eligible / marginal / excluded; marginal = within the
# tolerance band of a bound. Climate is a ranking signal — hard exclusion only
# when strict: true.
climate_rules:
  beach:     {min_day_max_c: 23, min_sea_c: 21, max_rain_days: 8, tolerance_c: 2, tolerance_rain_days: 2, strict: false}
  warm_city: {min_day_max_c: 17, max_rain_days: 9, tolerance_c: 2, tolerance_rain_days: 2, strict: false}

# Family (2+2) round-trip totals, EUR, carry-on basis.
tiers:
  short:  {notify_eur: 400,  super_eur: 280}   # <= 4.5 h
  medium: {notify_eur: 750,  super_eur: 550}   # 4.5-7 h (Canaries, Egypt, ...)
  long:   {notify_eur: 1500, super_eur: 1100}  # > 7 h (stretch destinations)

relative_deal: {vs_median_days: 60, ratio: 0.75}

providers:
  screen: [travelpayouts, ryanair]
  verify: google_flights
  verify_top_k: 3            # date-pair candidates sent to verify per watch

scheduler: {timezone: Europe/Tallinn, screen_cron: "45 2 * * *", verify_top_n: 8}
