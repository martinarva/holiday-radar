<!doctype html>
<!-- Dev UI, intentionally throwaway: no framework, no build step. The real
     investment is the JSON API this page consumes (/api/*). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>holiday-radar · dev</title>
<style>
  :root { --bg:#101613; --card:#18221e; --ink:#e4ece8; --mut:#8fa39b;
          --line:#26332d; --acc:#3fbfa8; --warn:#e5a356; --bad:#e07b62; }
  * { box-sizing:border-box }
  body { margin:0; padding:24px; background:var(--bg); color:var(--ink);
         font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  h1 { font-size:18px; margin:0 0 4px } h1 span{color:var(--acc)}
  .sub { color:var(--mut); margin-bottom:18px }
  .err { background:#3a201a; border:1px solid var(--bad); border-radius:6px;
         padding:8px 12px; margin:10px 0; white-space:pre-wrap }
  .hol { background:var(--card); border:1px solid var(--line); border-radius:8px;
         margin:16px 0; padding:14px 16px }
  .hol h2 { font-size:15px; margin:0 0 2px } .hol h2 b{color:var(--acc)}
  .meta { color:var(--mut); font-size:12.5px; margin-bottom:10px }
  .chips span { display:inline-block; background:#22302a; border-radius:99px;
                padding:1px 9px; margin-right:6px; font-size:12px }
  table { border-collapse:collapse; width:100%; margin-top:8px; font-size:13px }
  th { text-align:left; color:var(--mut); font-weight:normal; padding:4px 8px;
       border-bottom:1px solid var(--line); white-space:nowrap }
  td { padding:4px 8px; border-bottom:1px solid var(--line); white-space:nowrap }
  td.num { text-align:right; font-variant-numeric:tabular-nums }
  .direct{color:var(--acc)} .stop{color:var(--warn)} .mut{color:var(--mut)}
  .blind td{color:var(--mut)}
  .fam { font-weight:bold }
  .tag { font-size:11px; border:1px solid var(--line); border-radius:4px;
         padding:0 5px; color:var(--mut) }
  .wrap { overflow-x:auto }
  button { background:#22302a; color:var(--ink); border:1px solid var(--line);
           border-radius:6px; padding:2px 10px; cursor:pointer; font:inherit;
           font-size:12px }
</style>
</head>
<body>
<h1>holiday-radar <span>· dev</span></h1>
<div class="sub" id="health">loading…</div>
<div id="errors"></div>
<div id="holidays">loading…</div>

<script>
const fmtT = s => s ? s.replace("T"," ").slice(0,16)+"Z" : "–";
const money = v => v == null ? "–" : Math.round(v) + " €";

async function j(url){ const r = await fetch(url); if(!r.ok) throw new Error(url+" → "+r.status); return r.json(); }

function bestCell(b){
  if(!b) return `<td colspan="5" class="mut">no priced pair</td>`;
  const d = b.is_direct ? `<span class="direct">direct</span>`
                        : `<span class="stop">1-stop</span>`;
  const sd = b.school_days ? ` 🏫+${b.school_days}` : "";
  return `<td class="num fam">${money(b.family_eur)}</td>
          <td class="num">${money(b.adult_eur)}/ad</td>
          <td>${b.out_date} → ${b.back_date} (${b.nights}n)</td>
          <td>${d}${sd}</td>
          <td><span class="tag">${b.source}/${b.price_basis}</span></td>`;
}

async function load(){
  const h = await j("/health");
  const runs = await j("/api/runs?limit=5");
  const lastErrs = (h.last_run && h.last_run.errors) || [];
  document.getElementById("health").textContent =
    `data night: ${h.latest_night ?? "–"} · observations: ${h.observations_total}` +
    ` · last run: ${h.last_run ? h.last_run.kind+" @ "+fmtT(h.last_run.finished_at) : "never"}` +
    ` · errors in last run: ${lastErrs.length}` +
    ` · runs kept: ${runs.length}`;
  if(lastErrs.length)
    document.getElementById("errors").innerHTML =
      `<div class="err">last run errors:\n${lastErrs.join("\n")}</div>`;

  const data = await j("/api/holidays");
  const root = document.getElementById("holidays");
  root.innerHTML = "";
  for(const hol of data.holidays){
    const c = hol.counts;
    const div = document.createElement("div");
    div.className = "hol";
    div.innerHTML = `
      <h2><b>${hol.id}</b> — ${hol.name} <span class="mut">${hol.start} … ${hol.end}</span></h2>
      <div class="meta chips">
        <span>direct ${c.covered_direct||0}</span>
        <span>1-stop ${c.covered_1stop||0}</span>
        <span>blind ${c.blind||0}</span>
        <span>dormant ${c.dormant||0}</span>
        ${hol.best ? `<span>best: <b>${money(hol.best.family_eur)}</b> ${hol.best.origin}→${hol.best.destination}</span>` : ""}
      </div>
      <button data-h="${hol.id}">show watches</button>
      <div class="wrap" id="t-${hol.id}"></div>`;
    root.appendChild(div);
  }
  root.addEventListener("click", async ev => {
    const id = ev.target?.dataset?.h;
    if(!id) return;
    const box = document.getElementById("t-"+id);
    if(box.innerHTML){ box.innerHTML=""; ev.target.textContent="show watches"; return; }
    ev.target.textContent = "hide";
    const w = await j(`/api/holidays/${id}/watches`);
    const rows = w.watches.map(r => `
      <tr class="${r.coverage_class==='blind'||r.coverage_class==='dormant'?'blind':''}">
        <td>${r.origin}→${r.destination}</td>
        <td class="mut">${r.destination_name}</td>
        <td>${r.status} ${r.score} <span class="tag">${r.rule}</span></td>
        <td>${r.coverage_class.replace("covered_","")}</td>
        ${bestCell(r.best)}
      </tr>`).join("");
    box.innerHTML = `<table>
      <tr><th>watch</th><th></th><th>climate</th><th>coverage</th>
          <th>family est.</th><th>adult</th><th>best pair</th><th></th><th>source</th></tr>
      ${rows}</table>`;
  });
}
load().catch(e => document.getElementById("health").textContent = "ERROR: "+e);
</script>
</body>
</html>
