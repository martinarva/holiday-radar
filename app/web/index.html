<!doctype html>
<!-- Holiday-Radar UI v1 — implements docs/UX-SPEC.md.
     Recommendation-first, destination-first (Opportunity = holiday x
     destination). Vanilla + hash routing: no framework, no build step; the
     durable contract is the JSON API this consumes. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holiday Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0f1512; --surface:#151d19; --raise:#1b2521; --ink:#e8efeb; --mut:#93a8a0;
  --line:#26332e; --acc:#3fbfa8; --good:#4ade80; --fair:#e5a356; --bad:#e07b62;
  --info:#7ab8f5; --grey:#6b7a75;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 Inter,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
.num,.price{font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 72px}

/* header */
header{border-bottom:1px solid var(--line);background:var(--surface);
  position:sticky;top:0;z-index:20}
.hbar{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;
  align-items:center;gap:22px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand span{color:var(--acc)}
nav{display:flex;gap:4px;margin-left:6px}
nav a{padding:6px 12px;border-radius:8px;font-size:14px;color:var(--mut)}
nav a:hover{background:var(--raise);color:var(--ink)}
nav a.on{background:var(--raise);color:var(--ink);font-weight:600}
.status{margin-left:auto;font-size:13px;color:var(--mut);display:flex;
  align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.dot.warn{background:var(--fair)}

/* generic */
h1{font-size:26px;margin:26px 0 4px;letter-spacing:-.02em}
h2{font-size:17px;margin:30px 0 12px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--mut);font-size:14px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut)}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:5px;
  padding:1px 6px;color:var(--mut);white-space:nowrap}
.pill{font-size:12px;border-radius:999px;padding:2px 10px;font-weight:600}
.pill.good{background:#14361f;color:var(--good)}
.pill.fair{background:#3a2a15;color:var(--fair)}
.pill.info{background:#152b3d;color:var(--info)}
.pill.grey{background:#20272a;color:var(--grey)}
.btn{background:var(--acc);color:#06231e;border:0;border-radius:9px;
  padding:9px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.mid{font-size:20px;font-weight:600}
.small{font-size:13px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;
  color:var(--mut);font-size:14px}

/* hero */
.hero{background:linear-gradient(150deg,#17302a,#151d19 60%);
  border:1px solid #24473f;border-radius:14px;padding:22px}
.hero .kicker{font-size:12px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--acc)}
.facts{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 4px;font-size:14px}
.bar{height:6px;background:var(--raise);border-radius:99px;overflow:hidden;
  max-width:260px}
.bar > i{display:block;height:100%;background:var(--acc)}

/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;color:var(--mut);font-size:12px;
  text-transform:uppercase;letter-spacing:.05em;padding:6px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto}
.star{color:var(--acc)}

/* opportunity rows */
.opp{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;display:block;margin-bottom:10px}
.opp:hover{border-color:#33463f}
.opp .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.opp .rank{color:var(--mut);font-size:13px;min-width:26px}
.opp .name{font-size:17px;font-weight:600}
.alt{font-size:13px;color:var(--mut);margin-top:6px}
.matrix td{padding:5px 8px;text-align:right;font-size:13px}
.matrix td.lbl{text-align:left;color:var(--mut)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px;
  position:sticky;top:53px;background:var(--bg);padding:10px 0;z-index:10}
select{background:var(--raise);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;font-size:13.5px}
@media(max-width:640px){
  .wrap{padding:0 14px 60px} h1{font-size:22px} .big{font-size:26px}
  .filters{position:static}
  td,th{padding:6px 7px}
}
</style>
</head>
<body>
<header><div class="hbar">
  <div class="brand">✈ Holiday <span>Radar</span></div>
  <nav>
    <a href="#/" data-r="">Radar</a>
    <a href="#/system" data-r="system">System</a>
  </nav>
  <div class="status" id="status"><span class="dot"></span><span>loading…</span></div>
</div></header>
<div class="wrap" id="view"><p class="sub" style="margin-top:28px">Loading latest radar snapshot…</p></div>

<script>
// <template> parses in a neutral context, so standalone <tr>/<td> survive
// (a plain div would silently drop them).
const $ = (h) => { const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstChild; };
const eur = v => v==null ? "–" : "€" + Math.round(v).toLocaleString("en-US");
/* Escapes for BOTH text and attribute contexts. Quotes matter: airline names
   and airport codes come from scraped provider HTML, and a value carrying a
   quote could otherwise close an attribute and add its own. */
const ESCAPES = {"<":"&lt;", ">":"&gt;", "&":"&amp;", '"':"&quot;", "'":"&#39;",
                 "`":"&#96;", "=":"&#61;"};
const esc = s => String(s??"").replace(/[<>&"'`=]/g, c => ESCAPES[c]);
/* Provider-supplied lists (airlines, legs) are never trusted verbatim. */
const escList = (v, sep) => (v||[]).map(esc).join(sep);
const j = async u => { const r = await fetch(u); if(!r.ok) throw new Error(u+" → "+r.status); return r.json(); };
const ago = h => h==null ? "" : h < 1 ? "just now" : h < 24 ? `${Math.round(h)}h ago`
  : `${Math.round(h/24)}d ago`;
const dfmt = s => new Date(s+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});

// Qualitative on discovery screens; the number only appears in detail next
// to its "Why?" (review: "fair 4.0" alone is meaningless to a person).
const DEAL_CLS = {exceptional:"good", good:"good", fair:"fair",
                  expensive:"grey", unknown:"grey"};
function dealPill(o){
  const k = o.deal_key || "unknown", l = o.deal_label || "price unknown";
  return `<span class="pill ${DEAL_CLS[k]}">${k==="exceptional"?"🔥 ":""}${l}</span>`;
}
function scorePill(s){
  if(s==null) return `<span class="pill grey">collecting</span>`;
  const cls = s>=8 ? "good" : s>=6.5 ? "fair" : "grey";
  return `<span class="pill ${cls}">match ${s.toFixed(1)}/10</span>`;
}
function heroKicker(o){
  const k = o.deal_key;
  if(k === "exceptional") return {txt:"🔥 Exceptional deal", cls:"good"};
  if(k === "good") return {txt:"🔥 Good deal", cls:"good"};
  return {txt:"Best we've found so far", cls:"grey"};
}
function schoolChip(o){
  if(!o) return "";
  if(!o.school_days) return `<span title="fits inside the break">✓ no school missed</span>`;
  const parts=[]; if(o.school_before) parts.push(`${o.school_before} before`);
  if(o.school_after) parts.push(`${o.school_after} after`);
  return `<span title="school days missed">🏫 ${o.school_days} day${o.school_days>1?"s":""} (${parts.join(" · ")})</span>`;
}
function climChip(c){
  if(!c || c.t_max_c==null) return `<span class="mut">climate n/a</span>`;
  const bits = [`☀ ${Math.round(c.t_max_c)}°`];
  if(c.sea_c!=null) bits.push(`🌊 ${Math.round(c.sea_c)}°`);
  if(c.rain_days!=null) bits.push(`🌧 ${Math.round(c.rain_days)} d/mo`);
  return `<span>${bits.join(" · ")}</span> <span class="mut">${esc(c.label||"")}</span>`;
}
function verifChip(level){
  if(level==="flight-verified") return `<span class="pill info">✓ flight verified</span>`;
  if(level==="market-context") return `<span class="pill info">market context</span>`;
  return `<span class="pill grey">○ indicative</span>`;
}
function stops(o){ return o.is_direct ? `<span style="color:var(--good)">nonstop</span>`
                                      : `<span style="color:var(--fair)">1+ stop</span>`; }
/* Times come from scraped provider payloads, so the slice is validated
   rather than trusted to be "HH:MM". Anything else is dropped. */
const hhmm = s => {
  if(!s) return null;
  const t = String(s).slice(11, 16);
  return /^\d{2}:\d{2}$/.test(t) ? t : null;
};
function timesLine(o){
  const t = (o && o.times) || {};
  const out = hhmm(t.out_departure), outA = hhmm(t.out_arrival);
  const inD = hhmm(t.in_departure), inA = hhmm(t.in_arrival);
  if(!out && !inD) return `<span class="mut">times not published by ${esc(o.source||"source")}</span>`;
  const O = esc(o.origin || ""), D = esc(o._destination || o.destination || "");
  const rows = [];
  if(out) rows.push(`<span class="mut">out</span> ${O} <b>${out}</b>${
    outA?` → ${D} <b>${outA}</b>${dayShift(t.out_departure, t.out_arrival)}`:""}`);
  if(inD) rows.push(`<span class="mut">back</span> ${D} <b>${inD}</b>${
    inA?` → ${O} <b>${inA}</b>${dayShift(t.in_departure, t.in_arrival)}`:""}`);
  else if(out) rows.push(`<span class="mut">back — this source lists outbound legs only</span>`);
  return rows.join(" · ");
}
/* A "1 stop" that waits 16 hours in Warsaw is not the trip a "1 stop" label
   suggests — and the wait is often why the fare looked cheap. */
function layoverChip(o){
  const L = (o && o.layover) || {};
  if(o && o.is_direct) return `<span style="color:var(--good)">nonstop</span>`;
  if(L.max_hours == null) return `<span class="mut">stop length unknown</span>`;
  const h = L.max_hours;
  const col = h <= 3 ? "var(--good)" : h <= 5 ? "var(--fair)" : "var(--bad)";
  return `<span style="color:${col}">${esc(L.label || (h.toFixed(1)+"h layover"))}</span>`;
}
function legsLayover(legs){
  if(!legs || legs.length < 2) return null;
  let worst = null;
  for(let i = 0; i + 1 < legs.length; i++){
    const a = Date.parse(legs[i].arrival), b = Date.parse(legs[i+1].departure);
    if(isNaN(a) || isNaN(b) || b < a) continue;
    const h = (b - a) / 3600000;
    if(!worst || h > worst.h) worst = {h, at: legs[i].to, start: new Date(a), end: new Date(b)};
  }
  if(!worst) return null;
  // a wait touching 00:00-06:00, or a full day either way, means a room
  let overnight = worst.h >= 10;
  for(let t = new Date(worst.start); t < worst.end && !overnight; t.setHours(t.getHours()+1))
    if(t.getHours() < 6) overnight = true;
  return {...worst, overnight};
}
function offerConnection(x){
  if(x.is_direct) return `<span style="color:var(--good)">nonstop</span>`;
  const L = legsLayover(x.leg_details);
  if(!L) return `<span class="mut">${x.stops} stop${x.stops===1?"":"s"}</span>`;
  const col = L.h <= 3 ? "var(--good)" : L.h <= 5 ? "var(--fair)" : "var(--bad)";
  const hh = Math.floor(L.h), mm = Math.round((L.h % 1) * 60);
  return `<span style="color:${col}">${hh}h${String(mm).padStart(2,"0")} ${esc(L.at||"")}</span>`
       + (L.overnight ? `<br><span class="mut small">needs a hotel</span>` : "");
}
function layoverCell(o){
  const L = (o && o.layover) || {};
  if(o && o.is_direct) return `<span style="color:var(--good)">direct</span>`;
  if(L.max_hours == null) return `<span class="mut">?</span>`;
  const h = L.max_hours;
  const col = h <= 3 ? "var(--good)" : h <= 5 ? "var(--fair)" : "var(--bad)";
  const hh = Math.floor(h), mm = Math.round((h % 1) * 60);
  return `<span style="color:${col}">${hh}h${String(mm).padStart(2,"0")}</span>`
       + (L.overnight ? `<br><span class="mut small">+hotel</span>` : "");
}
/* Airport codes are not decoration here. A bare "12:35–23:59" was read as
   "lands home at 23:59, too late for the ferry" when it was the arrival in
   Orlando — the outbound leg. Every time says where it happens. */
const dayShift = (from, to) => {
  if(!from || !to) return "";
  const d = (new Date(to.slice(0,10)) - new Date(from.slice(0,10))) / 86400000;
  return d > 0 ? `<sup>+${d}</sup>` : "";
};
const timesCell = (o, og, dst) => {
  const t = (o && o.times) || {};
  const a = hhmm(t.out_departure), b = hhmm(t.out_arrival);
  const c = hhmm(t.in_departure), d = hhmm(t.in_arrival);
  if(!a && !c) return `<span class="mut">–</span>`;
  const O = esc(og || o.origin || ""), D = esc(dst || "");
  const out = a ? `${O} ${a}${b?` → ${D} ${b}${dayShift(t.out_departure,t.out_arrival)}`:""}`
                : "–";
  const back = c ? `${D} ${c}${d?` → ${O} ${d}${dayShift(t.in_departure,t.in_arrival)}`:""}`
                 : `<span title="this source lists outbound legs only">not published</span>`;
  return `${out}<br><span class="mut">${back}</span>`;
};

/* ---------------- Radar home ---------------- */
async function viewRadar(el){
  const d = await j("/api/radar");
  setStatus(d);
  const fam = `Family ${d.family.adults}+${d.family.children} · ${escList(d.origins," + ")}`;
  el.innerHTML = "";
  el.append($(`<div><h1>Find our next school-holiday trip</h1>
    <p class="sub">${fam} · snapshot ${d.night ?? "–"}</p></div>`));

  if(d.hero && d.hero.best_option){
    const h = d.hero, b = h.best_option, m = b.market || {};
    const vs = m.vs_market_pct!=null ? `<div>↓ ${Math.abs(m.vs_market_pct)}% vs recent market</div>` : "";
    const kick = heroKicker(h);
    el.append($(`<div class="hero" style="margin-top:18px">
      <div class="row"><span class="kicker">${kick.txt}</span>
        <span class="tag">${esc(h.holiday.name)}</span>
        <span style="margin-left:auto">${dealPill(h)}</span></div>
      <div style="margin-top:10px" class="row">
        <div style="flex:1;min-width:220px">
          <div class="mid">${esc(h.destination_name)}<span class="mut">, ${esc(h.country)}</span></div>
          <div class="big price">${eur(b.effective_eur)}</div>
          <div class="mut small">effective family cost${b.logistics_eur ?
            ` — ${eur(b.flights_eur)} flights + ${eur(b.logistics_eur)} logistics` : ""}${
            b.layover_hotel_eur ? ` + ${eur(b.layover_hotel_eur)} layover hotel` : ""}${
            b.origin_hotel_eur ? ` + ${eur(b.origin_hotel_eur)} for ${
              b.origin_hotel_nights || 1} ${esc(b.origin)} hotel night${
              (b.origin_hotel_nights || 1) > 1 ? "s" : ""}` : ""}</div>
        </div>
        <div style="min-width:220px">
          <div><b>${esc(b.origin)} → ${esc(h.destination)}</b> · ${stops(b)}</div>
          <div class="mut">${dfmt(b.out_date)} → ${dfmt(b.back_date)} · ${b.nights} nights</div>
          <div class="mut small">${escList(b.airlines," + ") || "airline n/a"}</div>
        </div>
      </div>
      <div class="facts">${schoolChip(b)} ${climChip(h.climate)} ${verifChip(b.verification.level)}</div>
      ${vs}
      <div class="row" style="margin-top:14px">
        <a class="btn" href="#/h/${h.holiday_id}/${esc(h.destination)}">View deal</a>
        <button class="btn ghost" onclick="alert('Tracking arrives with E3 alerts.')">♡ Track this trip</button>
      </div></div>`));
  } else {
    el.append($(`<div class="empty" style="margin-top:18px">Nothing unusually cheap yet —
      the radar is still collecting prices. You'll see a deal here as soon as one appears.</div>`));
  }

  el.append($(`<h2>Upcoming school holidays</h2>`));
  const g = $(`<div class="grid g3"></div>`);
  for(const h of d.holidays){
    if(!h.on_sale){
      g.append($(`<div class="card"><h3>${esc(h.name)}</h3>
        <div class="mut small">${dfmt(h.start)} – ${dfmt(h.end)} · ${h.days_away} days away</div>
        <div style="margin:14px 0 6px"><span class="pill grey">not on sale yet</span></div>
        <div class="mut small">${h.dormant} destinations ready — the radar starts
          automatically when schedules open.</div></div>`));
      continue;
    }
    const b = h.best, bo = b && b.best_option;
    const c = h.cheapest, co = c && c.cheapest_option;
    const cheapBlock = (co && !h.cheapest_is_best)
      ? `<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px">
           <div class="mut small">Cheapest overall</div>
           <div class="row"><span class="mid price">${eur(co.effective_eur)}</span>
             <span class="small">${esc(c.destination_name)}</span></div>
           <div class="small">${climChip(c.climate)}</div>
           <div class="small"><b>${dfmt(co.out_date)} → ${dfmt(co.back_date)}</b>
             <span class="mut">· ${co.nights} nights</span></div>
           <div class="mut small">${co.origin} · ${co.is_direct?"direct":"1+ stop"} ·
             ${co.school_days?("🏫 "+co.school_days):"✓ 0 school days"}</div></div>`
      : (co ? `<div class="mut small" style="margin-top:10px">Also the cheapest option.</div>` : "");
    g.append($(`<div class="card"><h3>${esc(h.name)}</h3>
      <div class="mut small">${dfmt(h.start)} – ${dfmt(h.end)} · ${h.days_away} days away</div>
      ${bo ? `<div class="mut small" style="margin-top:12px">Best match</div>
        <div class="row"><span class="mid">${esc(b.destination_name)}</span>${dealPill(b)}</div>
        <div class="big price">${eur(bo.effective_eur)}</div>
        <div class="small" style="margin:2px 0 2px">${climChip(b.climate)}</div>
        <div class="small"><b>${dfmt(bo.out_date)} → ${dfmt(bo.back_date)}</b>
          <span class="mut">· ${bo.nights} nights</span></div>
        <div class="mut small">${bo.origin} · ${bo.is_direct ? "direct" : "1+ stop"} ·
          ${escList(bo.airlines," + ") || "airline n/a"} ·
          ${bo.school_days ? "🏫 "+bo.school_days : "✓ 0 school days"}</div>
        ${cheapBlock}`
        : `<div class="empty" style="margin:12px 0">No prices yet — scanning has just started.</div>`}
      <div class="mut small" style="margin-top:12px">${h.priced} priced ·
        ${h.scanning} still scanning · coverage ${h.coverage_pct}%</div>
      <div style="margin-top:12px"><a class="btn ghost" href="#/h/${h.id}">Explore →</a></div>
    </div>`));
  }
  el.append(g);

  el.append($(`<h2>Recent movers</h2>`));
  if(!d.movers.length){
    el.append($(`<div class="empty">No movement yet — price changes appear once the
      radar has more than one night of history for a route.</div>`));
  } else {
    const t = $(`<div class="card scroll"><table><thead><tr><th>Route</th><th>Holiday</th>
      <th class="n">Was</th><th class="n">Now</th><th class="n">Change</th></tr></thead>
      <tbody></tbody></table></div>`);
    const tb = t.querySelector("tbody");
    for(const m of d.movers){
      const up = m.delta_eur > 0;
      tb.append($(`<tr><td>${m.origin}→${m.destination}</td><td class="mut">${m.holiday_id}</td>
        <td class="n price mut">${eur(m.from_eur)}</td><td class="n price">${eur(m.to_eur)}</td>
        <td class="n" style="color:${up?"var(--bad)":"var(--good)"}">${up?"↑":"↓"} ${Math.abs(m.delta_pct)}%</td></tr>`));
    }
    el.append(t);
  }
}

/* ---------------- Holiday detail ---------------- */
const FILTERS = {sort:"best", origin:"any", stops:"any", school:"any", price:"any"};
const PAGE = 10;
async function viewHoliday(el, hid){
  const d = await j(`/api/holidays/${hid}/opportunities`);
  const h = d.holiday;
  let expanded = false;
  el.innerHTML = "";
  el.append($(`<div><p class="sub" style="margin-top:22px"><a href="#/">← Radar</a></p>
    <h1>${esc(h.name)}</h1>
    <p class="sub">${dfmt(h.start)} – ${dfmt(h.end)} · ${h.days_away} days away ·
      <b>${h.priced} priced</b> · ${h.scanning} still scanning · coverage ${h.coverage_pct}%</p></div>`));

  // Recommended vs Cheapest up front — two different questions (UX-SPEC §9)
  const rb = h.best && h.best.best_option, cb = h.cheapest && h.cheapest.cheapest_option;
  if(rb){
    const same = h.cheapest_is_best;
    el.append($(`<div class="grid ${same?"":"g2"}" style="margin-top:14px">
      <div class="card"><div class="mut small">Recommended</div>
        <div class="row"><span class="mid">${esc(h.best.destination_name)}</span>${dealPill(h.best)}</div>
        <div class="big price">${eur(rb.effective_eur)}</div>
        <div class="mut small">${rb.origin} · ${rb.is_direct?"direct":"1+ stop"} ·
          ${dfmt(rb.out_date)}→${dfmt(rb.back_date)} ·
          ${rb.school_days?("🏫 "+rb.school_days):"✓ 0 school days"}</div>
        <div class="small" style="margin-top:4px">${climChip(h.best.climate)}</div></div>
      ${same ? "" : `<div class="card"><div class="mut small">Cheapest</div>
        <div class="row"><span class="mid">${esc(h.cheapest.destination_name)}</span>${dealPill(h.cheapest)}</div>
        <div class="big price">${eur(cb.effective_eur)}</div>
        <div class="mut small">${cb.origin} · ${cb.is_direct?"direct":"1+ stop"} ·
          ${dfmt(cb.out_date)}→${dfmt(cb.back_date)} ·
          ${cb.school_days?("🏫 "+cb.school_days):"✓ 0 school days"}</div>
        <div class="small" style="margin-top:4px">${climChip(h.cheapest.climate)}</div></div>`}
    </div>`));
  }

  const f = $(`<div class="filters">
    <select id="f-sort">
      <option value="best">Best match</option>
      <option value="deal">Best deal (market)</option>
      <option value="cost">Lowest total cost</option>
      <option value="weather">Best weather</option>
      <option value="school">Fewest school days</option>
    </select>
    <select id="f-price"><option value="any">Any price</option>
      <option value="750">≤ €750</option><option value="1000">≤ €1000</option>
      <option value="1500">≤ €1500</option></select>
    <select id="f-origin"><option value="any">Any origin</option>
      ${["TLL","HEL","RIX"].map(o=>`<option value="${o}">${o} only</option>`).join("")}</select>
    <select id="f-stops"><option value="any">Any connections</option>
      <option value="direct">Direct only</option></select>
    <select id="f-school"><option value="any">School: any</option>
      <option value="0">0 days</option><option value="1">≤1 day</option>
      <option value="2">≤2 days</option></select>
  </div>`);
  el.append(f);
  const list = $(`<div></div>`);
  el.append(list);

  function render(){
    const priced = d.opportunities.filter(o => o.state === "priced");
    let rows = priced.map(o => {
      let opts = o.origin_options;
      if(FILTERS.origin !== "any") opts = opts.filter(x => x.origin === FILTERS.origin);
      if(FILTERS.stops === "direct") opts = opts.filter(x => x.is_direct);
      if(FILTERS.school !== "any") opts = opts.filter(x => x.school_days <= +FILTERS.school);
      if(FILTERS.price !== "any") opts = opts.filter(x => x.effective_eur <= +FILTERS.price);
      if(!opts.length) return null;
      const best = FILTERS.sort === "cost"
        ? opts.reduce((a,b)=> b.effective_eur < a.effective_eur ? b : a)
        : opts.reduce((a,b)=> (b.score??0) > (a.score??0) ? b : a);
      return {...o, _opts: opts, _best: best};
    }).filter(Boolean);

    const key = {
      best: r => -(r._best.score ?? 0),
      deal: r => -(r.market_score ?? -1),
      cost: r => r._best.effective_eur,
      weather: r => -(r.climate.score ?? 0),
      school: r => r._best.school_days,
    }[FILTERS.sort];
    rows.sort((a,b)=> key(a)-key(b));

    list.innerHTML = "";
    if(!rows.length){
      list.append($(`<div class="empty">No destination matches these filters yet.
        ${priced.length ? "Try relaxing them — " + priced.length + " destinations are priced."
        : "Scanning has just started; first results appear over the next few radar cycles."}</div>`));
    }
    const shown = expanded ? rows : rows.slice(0, PAGE);
    shown.forEach((r,i)=>{
      const b = r._best;
      const alts = r._opts.filter(o => o !== b)
        .map(o => `${o.origin} ${eur(o.effective_eur)} ${o.is_direct?"direct":"1+ stop"}
          ${o.school_days? "🏫"+o.school_days : "✓0"}`).join(" · ");
      const mk = r.market_score!=null
        ? `<span class="mut small">market ${r.market_score.toFixed(1)}/10</span>` : "";
      list.append($(`<a class="opp" href="#/h/${r.holiday_id}/${r.destination}">
        <div class="head"><span class="rank">#${i+1}</span>
          <span class="name">${esc(r.destination_name)}</span>
          <span class="mut small">${esc(r.country)}</span>
          <span style="margin-left:auto">${dealPill(b)}</span></div>
        <div class="mut small" style="margin:4px 0 10px">${climChip(r.climate)}</div>
        <div class="row">
          <div style="min-width:150px"><span class="mid price">${eur(b.effective_eur)}</span>
            <span class="mut small"> effective</span></div>
          <div><b>${esc(b.origin)}</b> · ${stops(b)} · ${b.nights} nights ·
            <span class="mut">${dfmt(b.out_date)}→${dfmt(b.back_date)}</span></div>
          <div class="small">${schoolChip(b)}</div>
          <div style="margin-left:auto" class="small">${verifChip(b.verification.level)} ${mk}</div>
        </div>
        ${alts ? `<div class="alt">Other origins: ${alts}</div>` : ""}
      </a>`));
    });
    if(!expanded && rows.length > PAGE){
      const more = $(`<button class="btn ghost" style="margin-top:6px">
        Show ${rows.length - PAGE} more destinations</button>`);
      more.onclick = () => { expanded = true; render(); };
      list.append(more);
    }
    const scanning = d.opportunities.filter(o=>o.state==="scanning").length;
    if(scanning) list.append($(`<p class="mut small" style="margin-top:14px">
      🔎 ${scanning} more destinations are still being scanned — results improve each night.</p>`));
  }
  for(const k of ["sort","origin","stops","school","price"]){
    const sel = f.querySelector("#f-"+k);
    sel.value = FILTERS[k];
    sel.onchange = () => { FILTERS[k] = sel.value; render(); };
  }
  render();
}

/* ---------------- Opportunity detail ---------------- */
async function viewOpportunity(el, hid, dst){

  el.innerHTML = "";
  el.append($(`<div><p class="sub" style="margin-top:22px">
      <a href="#/h/${hid}">← ${esc(d.holiday.name)}</a></p>

    <p class="sub">${climChip(o.climate)}</p></div>`));

  if(!b){
    el.append($(`<div class="empty" style="margin-top:16px">
      ${o.state === "dormant" ? "Flights aren't on sale yet. We'll start automatically when schedules open."

  }

  const g = $(`<div class="grid g2" style="margin-top:16px"></div>`);
  g.append($(`<div class="card">
    <div class="kicker mut small" style="letter-spacing:.08em">RECOMMENDED</div>
    <div class="mid" style="margin:6px 0">${esc(b.origin)} → ${o.destination}</div>
    <div class="mut">${dfmt(b.out_date)} → ${dfmt(b.back_date)} · ${b.nights} nights · ${layoverChip(b)}</div>
    <div class="small" style="margin-top:4px">${timesLine(b)}</div>
    <div class="big price" style="margin-top:10px">${eur(b.effective_eur)}</div>
    <div class="mut small">${b.logistics_eur ? `${eur(b.flights_eur)} flights + ${eur(b.logistics_eur)} ${esc(b.origin)} logistics`
      : "no origin logistics"}${b.layover_hotel_eur ? ` + ${eur(b.layover_hotel_eur)} layover hotel` : ""}${
      b.origin_hotel_eur ? ` + ${eur(b.origin_hotel_eur)} for ${
        b.origin_hotel_nights || 1} ${esc(b.origin)} hotel night${
        (b.origin_hotel_nights || 1) > 1 ? "s" : ""}` : ""}${
      b.hotel_risk_eur ? ` · +${eur(b.hotel_risk_eur)} hotel if the flight is early/late` : ""}</div>
    ${b.from_night ? `<div class="mut small">carried over from ${esc(b.from_night)} — no fresh quote tonight</div>` : ""}
    <div class="facts small">${schoolChip(b)} · ${escList(b.airlines," + ")||"airline n/a"}</div>
    <div class="row" style="margin-top:12px">${dealPill(b)} ${scorePill(b.score)}</div>
    <div class="small mut" style="margin-top:8px">Why?<br>${
      (b.reasons||[]).map(r=>(r.good?"✓ ":"△ ")+esc(r.text)).join("<br>")}</div>
    <div class="row" style="margin-top:12px">${verifChip(b.verification.level)}
      <span class="mut small">source ${esc(b.source)} · updated ${ago(b.age_hours)}</span></div>
    ${b.verify_mode === "carrier-direct" ? `
      <div class="small mut" style="margin-top:8px;border-left:2px solid var(--line);padding-left:10px">
        This fare comes straight from ${esc((b.airlines||["the carrier"])[0])}. Google Flights
        does not index low-cost carriers, so a live check can only show what
        other airlines cost.</div>
      <div class="row" style="margin-top:12px">
        <button class="btn" onclick="alert('Alternative-market check lands with E3.')">Check alternatives</button>
        <button class="btn ghost" onclick="alert('Tracking arrives with E3 alerts.')">♡ Track</button>
      </div>`
    : `<div class="row" style="margin-top:12px">
        <button class="btn" onclick="alert('Live verification lands with E3.')">Check live price</button>
        <button class="btn ghost" onclick="alert('Tracking arrives with E3 alerts.')">♡ Track</button>
      </div>`}</div>`));

  const m = b.market || {};
  g.append($(`<div class="card">
    <div class="kicker mut small" style="letter-spacing:.08em">PRICE SIGNAL</div>
    ${m.state === "ready" ? `
      <div class="mut small">How the FARE is moving. Logistics and hotels are
        our overheads, not the market's — they sit in the effective price
        above, and mixing them in here once showed a EUR 847 "current"
        against a EUR 700 median while claiming 0% vs market.</div>
      <table style="margin-top:8px"><tbody>
        <tr><td>Current fare</td><td class="n price">${eur(b.flights_eur)}</td></tr>
        <tr><td>Median (${m.nights} nights)</td><td class="n price mut">${eur(m.median_eur)}</td></tr>
        <tr><td>Recent low</td><td class="n price mut">${eur(m.low_eur)}</td></tr>
      </tbody></table>
      <div style="margin-top:10px">${m.vs_market_pct<=0?"↓":"↑"} ${Math.abs(m.vs_market_pct)}% vs market</div>
      <div class="bar" style="margin-top:8px"><i style="width:${(m.score||0)*10}%"></i></div>
      <div class="mut small">market score ${m.score}/10 — how good this price is historically
        (not the same as match score)</div>`
    : `<div class="empty" style="margin-top:8px">Collecting history — a market score needs a
        few nights of observations for this route. ${m.nights||0} so far.</div>`}
  </div>`));
  el.append(g);

  el.append($(`<h2>How to get there</h2>`));
  const t = $(`<div class="card scroll"><table><thead><tr><th>Origin</th><th class="n">Flights</th>
    <th class="n">Logistics</th><th class="n">Effective</th><th>Trip · longest stop</th>
    <th>Times<br><span style="text-transform:none">out / back</span></th>
    <th>School</th><th>Airline</th><th>Why</th></tr></thead><tbody></tbody></table></div>`);
  const tb = t.querySelector("tbody");
  for(const opt of o.origin_options){
    const rec = opt === b || opt.origin === b.origin;
    tb.append($(`<tr>
      <td>${rec?'<span class="star">★</span> ':""}<b>${opt.origin}</b></td>
      <td class="n price">${eur(opt.flights_eur)}</td>
      <td class="n price mut">${opt.logistics_eur?"+"+eur(opt.logistics_eur):"—"}</td>
      <td class="n price"><b>${eur(opt.effective_eur)}</b>${
        opt.origin_hotel_eur ? `<br><span class="mut small">incl. ${eur(opt.origin_hotel_eur)} hotel</span>` : ""}${
        opt.from_night ? `<br><span class="mut small">from ${esc(opt.from_night)}</span>` : ""}</td>
      <td>${opt.nights}n · ${layoverCell(opt)}</td>
      <td class="small">${timesCell(opt, opt.origin, o.destination)}</td>
      <td>${opt.school_days?("🏫 "+opt.school_days):"✓ 0"}</td>
      <td class="mut">${escList(opt.airlines,"+")||"–"}</td>
      <td class="mut small">${(opt.reasons||[]).slice(0,2).map(r=>(r.good?"✓ ":"△ ")+esc(r.text)).join("<br>")}</td>
    </tr>`));
  }
  el.append(t);

  if(d.school_ladder.length > 1){
    el.append($(`<h2>Price vs school days</h2>`));
    const l = $(`<div class="card scroll"><table><thead><tr><th>School days</th><th>Dates</th>
      <th>Origin</th><th class="n">Effective</th><th class="n">vs no school missed</th></tr></thead>
      <tbody></tbody></table></div>`);
    const lb = l.querySelector("tbody");
    for(const p of d.school_ladder){
      const dv = p.diff_vs_zero_school_eur;
      const cell = dv == null ? `<span class="mut">baseline</span>`
        : dv < 0 ? `<span style="color:var(--good)">saves ${eur(-dv)}</span>`
                 : `<span style="color:var(--fair)">costs ${eur(dv)} more</span>`;
      lb.append($(`<tr><td>${p.school_days?("🏫 "+p.school_days):"✓ none"}</td>
        <td>${dfmt(p.out_date)} → ${dfmt(p.back_date)} <span class="mut">(${p.nights}n)</span></td>
        <td>${p.origin}</td><td class="n price">${eur(p.effective_eur)}${
          p.layover_hotel_eur ? `<br><span class="mut small">incl. ${eur(p.layover_hotel_eur)} hotel</span>` : ""}</td>
        <td class="n">${cell}</td></tr>`));
    }
    el.append(l);
    el.append($(`<p class="mut small">The radar doesn't decide — it makes the trade-off visible.</p>`));
  }

  if(d.date_pairs.length > 1){
    el.append($(`<h2>Date options</h2>`));
    const byOrigin = {};
    d.date_pairs.forEach(p => (byOrigin[p.origin] ||= []).push(p));
    for(const [og, ps] of Object.entries(byOrigin)){
      const outs = [...new Set(ps.map(p=>p.out_date))].sort();
      const backs = [...new Set(ps.map(p=>p.back_date))].sort();
      const cell = {};
      ps.forEach(p => cell[p.out_date+"|"+p.back_date] = p);
      const prices = ps.map(p=>p.effective_eur);
      const lo = Math.min(...prices), hi = Math.max(...prices);
      // markers: € cheapest here, ★ the recommended pair, ✓ cheapest 0-school
      const cheapCell = ps.reduce((a,x)=> x.effective_eur < a.effective_eur ? x : a);
      const zeroCells = ps.filter(x=>!x.school_days);
      const zeroCell = zeroCells.length
        ? zeroCells.reduce((a,x)=> x.effective_eur < a.effective_eur ? x : a) : null;
      const mark = p => {
        const m = [];
        if(b && p.origin===b.origin && p.out_date===b.out_date && p.back_date===b.back_date) m.push("★");
        if(p===cheapCell) m.push("€");
        if(zeroCell && p===zeroCell) m.push("✓");
        return m.length ? `<span class="star" style="font-size:11px"> ${m.join("")}</span>` : "";
      };
      const mt = $(`<div class="card scroll" style="margin-bottom:12px">
        <h3>${og} <span class="mut small">— depart (rows) × return (columns), effective family cost</span></h3>
        <table class="matrix"><thead><tr><th></th>${backs.map(b=>`<th class="n">${dfmt(b)}</th>`).join("")}</tr></thead>
        <tbody>${outs.map(o2=>`<tr><td class="lbl">${dfmt(o2)}</td>${backs.map(b2=>{
          const p = cell[o2+"|"+b2];
          if(!p) return `<td class="mut">·</td>`;
          const rel = hi>lo ? (p.effective_eur-lo)/(hi-lo) : 0;
          const col = rel<.34?"var(--good)":rel<.67?"var(--fair)":"var(--mut)";
          const tip = `${eur(p.effective_eur)} effective · ${eur(p.flights_eur)} flights · `
            + `${p.nights} nights · ${p.is_direct?"nonstop":"with a connection"} · `
            + `${p.school_days?p.school_days+" school days":"no school missed"}`
            + `${(p.airlines||[]).length?" · "+escList(p.airlines," + "):""}`;
          return `<td style="color:${col}" title="${esc(tip)}">
            ${eur(p.effective_eur)}${mark(p)}${p.school_days?`<br><span class="mut" style="font-size:11px">🏫${p.school_days}</span>`:""}</td>`;
        }).join("")}</tr>`).join("")}</tbody></table></div>`);
      el.append(mt);
    }
  }

  if(d.offers.length){
    el.append($(`<h2>All itineraries seen</h2>`));
    const of = $(`<div class="card scroll"><table><thead><tr><th class="n">#</th><th class="n">Family</th>
      <th>Airlines</th><th>Routing</th><th>Times</th><th>Connection</th><th>Dates</th>
      <th>From</th></tr></thead><tbody></tbody></table></div>`);
    const ob = of.querySelector("tbody");
    d.offers.slice(0,25).forEach((x,i)=>{
      ob.append($(`<tr><td class="n mut">${i+1}</td><td class="n price">${eur(x.price_total_eur)}</td>
        <td>${escList(x.airlines," + ")||"–"}</td>
        <td class="mut small">${escList(x.legs,"  ")}</td>
        <td class="small">${(x.leg_details||[]).length
          ? x.leg_details.map(l=>`${esc(l.from)}&nbsp;${hhmm(l.departure)||"–"}→${hhmm(l.arrival)||"–"}`).join("<br>")
          : '<span class="mut">–</span>'}</td>
        <td>${offerConnection(x)}</td>
        <td class="mut">${dfmt(x.out_date)}→${dfmt(x.back_date)}</td>
        <td class="mut small">${esc(x.origin)} · ${esc(x.source)}</td></tr>`));
    });
    el.append(of);
  }
}

async function viewSystem(el){
  const [s, v] = await Promise.all([j("/api/system"), j("/api/verifications?limit=20")]);
  el.innerHTML = "";
  const lr = s.last_run || {};
  el.append($(`<div><h1>System</h1><p class="sub">Diagnostics — everything the
    normal screens deliberately hide.</p></div>`));
  el.append($(`<div class="grid g3" style="margin-top:16px">
    <div class="card"><h3>Last run</h3>
      <table><tbody>
      <tr><td>Night</td><td class="n">${s.night ?? "–"}</td></tr>
      <tr><td>Discovery</td><td class="n">${lr.discovery_used ?? "–"}/${lr.discovery_budget ?? "–"}
        (${lr.discovery_priced ?? 0} priced)</td></tr>
      <tr><td>Audit</td><td class="n">${lr.audit_used ?? "–"}/${lr.audit_budget ?? "–"}</td></tr>
      <tr><td>Verify rows</td><td class="n">${lr.verify_rows ?? "–"}</td></tr>
      <tr><td title="Blind watches that must receive at least one sample within the
        configured starvation window (14 nights), regardless of priority score.">
        Exploration floor due</td><td class="n">${lr.floor_due ?? "–"} watches</td></tr>
      <tr><td>Errors</td><td class="n" style="color:${s.errors.length?"var(--bad)":"var(--good)"}">${s.errors.length}</td></tr>
      </tbody></table></div>
    <div class="card"><h3>Observations by source</h3>
      <table><tbody>${Object.entries(s.observations_by_source)
        .map(([k,c])=>`<tr><td>${esc(k)}</td><td class="n price">${c}</td></tr>`).join("")}</tbody></table></div>
    <div class="card"><h3>Providers</h3>
      <table><tbody>${s.providers.map(p=>`<tr><td>${esc(p.name)}</td>
        <td class="mut small">${p.role}</td>
        <td class="n"><span class="pill ${p.state==="healthy"?"good":p.state==="disabled"?"grey":"info"}">${p.state}</span></td></tr>`).join("")}</tbody></table></div>
  </div>`));

  el.append($(`<h2>Coverage per holiday</h2>`));
  const c = $(`<div class="card scroll"><table><thead><tr><th>Holiday</th><th class="n">Direct</th>
    <th class="n">1-stop</th><th class="n">Blind</th><th class="n">Dormant</th></tr></thead>
    <tbody></tbody></table></div>`);
  const cb = c.querySelector("tbody");
  for(const [hid, m] of Object.entries(s.coverage)){
    cb.append($(`<tr><td>${hid}</td><td class="n">${m.covered_direct||0}</td>
      <td class="n">${m.covered_1stop||0}</td><td class="n">${m.blind||0}</td>
      <td class="n mut">${m.dormant||0}</td></tr>`));
  }
  el.append(c);

  if(v.length){
    el.append($(`<h2>Verifications & market context</h2>`));
    const t = $(`<div class="card scroll"><table><thead><tr><th>Watch</th><th>Dates</th>
      <th class="n">Result</th><th>Meaning</th><th>Airlines</th><th>Level</th></tr></thead>
      <tbody></tbody></table></div>`);
    const tb = t.querySelector("tbody");
    for(const x of v){
      const meaning = x.level === "market-context"
        ? `<span class="mut">carrier fare ${eur(x.carrier_fare_eur)} · alternative is
           <b>${eur(x.saving_vs_alternative_eur)} more</b> — Google can't price this carrier</span>`
        : (x.delta_eur==null ? "" : `<span style="color:${x.delta_eur<=0?"var(--good)":"var(--fair)"}">
           ${x.delta_eur>0?"+":""}${eur(x.delta_eur)} vs indicative</span>`);
      tb.append($(`<tr><td>${x.origin}→${x.destination}</td>
        <td class="mut">${dfmt(x.out_date)}→${dfmt(x.back_date)}</td>
        <td class="n price">${eur(x.price_total_eur)}</td>
        <td class="small">${meaning}</td>
        <td class="mut small">${escList(x.airlines,"+")}</td>
        <td>${verifChip(x.level)}</td></tr>`));
    }
    el.append(t);
  }

  if(s.errors.length){
    el.append($(`<h2>Errors in last run</h2>`));
    el.append($(`<div class="card"><pre class="small mut" style="white-space:pre-wrap;margin:0">${
      esc(s.errors.join("\n"))}</pre></div>`));
  }
}

/* ---------------- router ---------------- */
function setStatus(d){
  const s = document.getElementById("status");
  const healthy = d.health === "healthy";
  s.innerHTML = `<span class="dot ${healthy?"":"warn"}"></span>
    <span>${healthy ? "All systems healthy" : d.error_count+" issue(s) last run"} ·
    scan ${d.updated_at ? new Date(d.updated_at).toLocaleString("en-GB",{hour:"2-digit",minute:"2-digit",day:"numeric",month:"short"}) : "–"}</span>`;
}
let statusLoaded = false;
async function route(){
  const el = document.getElementById("view");
  if(!statusLoaded){
    statusLoaded = true;
    j("/api/radar").then(setStatus).catch(()=>{});
  }
  const parts = (location.hash.replace(/^#\/?/, "")).split("/").filter(Boolean);
  document.querySelectorAll("nav a").forEach(a =>
    a.classList.toggle("on", (a.dataset.r||"") === (parts[0]==="h" ? "" : (parts[0]||""))));
  try{
    if(parts[0] === "system") await viewSystem(el);
    else if(parts[0] === "h" && parts[2]) await viewOpportunity(el, parts[1], parts[2]);
    else if(parts[0] === "h") await viewHoliday(el, parts[1]);
    else await viewRadar(el);
    window.scrollTo(0,0);
  }catch(e){
    el.innerHTML = `<div class="empty" style="margin-top:24px">Couldn't load: ${esc(e.message)}</div>`;
  }
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
